services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    env_file: .env
    ports:
      - "9190:8501"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
